name: RainRoute
options:
  bundleIdPrefix: com.thusharpradeep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  RainRoute:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RainRoute
        excludes:
          - "Info.plist"
    info:
      path: RainRoute/Info.plist
      properties:
        CFBundleDisplayName: RainRoute
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "RainRoute. Weather by Open-Meteo. Maps and routing data by OpenStreetMap contributors."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thusharpradeep.rainroute
        PRODUCT_NAME: RainRoute
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        SUPPORTS_MACCATALYST: false

  RainRouteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RainRouteTests
    dependencies:
      - target: RainRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thusharpradeep.rainroute.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RainRoute.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RainRoute"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RainRoute:
    build:
      targets:
        RainRoute: all
        RainRouteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RainRouteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
