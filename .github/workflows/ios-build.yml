name: Build RainRoute

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RainRoute/**"
      - "RainRouteTests/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "RainRoute/**"
      - "RainRouteTests/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: rainroute-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: RainRoute
      BUNDLE_ID: com.thusharpradeep.rainroute

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data.get("devices", {}), reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit
          ')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = [
              runtime for runtime in data.get("runtimes", [])
              if runtime.get("isAvailable") and runtime.get("platform") == "iOS"
          ]
          if not candidates:
              raise SystemExit("No iOS simulator runtime is installed.")
          candidates.sort(key=lambda runtime: [int(part) for part in runtime["version"].split(".")])
          print(candidates[-1]["identifier"])
          ')
            device_type=$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for device_type in data.get("devicetypes", []):
              if "iPhone" in device_type.get("name", ""):
                  print(device_type["identifier"])
                  raise SystemExit
          raise SystemExit("No iPhone simulator device type is installed.")
          ')
            udid=$(xcrun simctl create "RainRoute Test iPhone" "$device_type" "$runtime")
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "Using simulator $udid"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project RainRoute.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build-tests \
            -only-testing:RainRouteTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rainroute-test-results
          path: build-tests/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project RainRoute.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          cp -R build-device/Build/Products/Release-iphoneos/RainRoute.app artifacts/Payload/
          cd artifacts
          zip -qry RainRoute-unsigned.ipa Payload
          ls -lh RainRoute-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rainroute-ipa
          path: artifacts/RainRoute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
